[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "reelsave"
version = "1.0.0"
description = "Cross-platform Instagram Reels downloader with a Qt desktop interface"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["PySide6>=6.8,<7", "yt-dlp>=2025.3.31"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]
build = ["pyinstaller>=6.11"]

[project.scripts]
reelsave = "reelsave.app:main"
reelsave-cli = "reelsave.cli:main"

[tool.setuptools.packages.find]
include = ["reelsave*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
